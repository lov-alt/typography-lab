<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e5df"/><stop offset="100%" stop-color="#ddd9d0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Canvas -->
  <rect x="20" y="20" width="480" height="460" fill="url(#canvas)" rx="8" filter="url(#shadow)"/>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/></filter></defs>

  <!-- Text blocks on canvas -->
  <text x="58" y="80" font-family="sans-serif" font-weight="900" font-size="22" fill="#e63946" letter-spacing="-0.5">THE VELVET</text>
  <text x="58" y="105" font-family="sans-serif" font-weight="900" font-size="22" fill="#e63946" letter-spacing="-0.5">UNDERGROUND</text>
  <text x="58" y="220" font-family="sans-serif" font-weight="900" font-size="42" fill="#1a1a1a" letter-spacing="-1">LIVE</text>
  <text x="58" y="255" font-family="sans-serif" font-weight="900" font-size="42" fill="#1a1a1a" letter-spacing="-1">IN CONCERT</text>
  <text x="58" y="360" font-family="sans-serif" font-weight="600" font-size="8" fill="#1a1a1a" letter-spacing="1">2026.07.15 SAT · 20:00</text>
  <text x="58" y="380" font-family="sans-serif" font-size="7" fill="#457b9d">O2 Academy Brixton · London, UK</text>
  <text x="58" y="410" font-family="sans-serif" font-weight="700" font-size="9" fill="#e63946">TICKETS →</text>

  <!-- Selection ring on one block -->
  <rect x="52" y="200" width="120" height="60" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 3" rx="2" fill="none" opacity="0.6"/>

  <!-- Right panel -->
  <rect x="520" y="20" width="360" height="460" fill="#1e1e32" rx="8"/>

  <!-- Panel: content type selector -->
  <rect x="540" y="40" width="320" height="28" fill="#2a2a40" rx="6"/>
  <text x="554" y="58" font-family="sans-serif" font-size="9" fill="#888">摇滚音乐会 · Rock Concert</text>

  <!-- Panel: tradition -->
  <rect x="540" y="82" width="320" height="48" fill="#2a2a40" rx="6" opacity="0.6"/>
  <text x="554" y="100" font-family="sans-serif" font-size="8" fill="#6366f1">Swiss / International Typographic Style</text>
  <text x="554" y="118" font-family="sans-serif" font-size="7" fill="#666">grid-based · asymmetric · high-contrast · geometric</text>

  <!-- Panel: import buttons -->
  <rect x="540" y="144" width="155" height="32" stroke="#444" stroke-width="1.5" stroke-dasharray="3 2" rx="8" fill="none"/>
  <text x="578" y="164" font-family="sans-serif" font-size="8" fill="#888">+ Import Font</text>
  <rect x="705" y="144" width="155" height="32" stroke="#444" stroke-width="1.5" stroke-dasharray="3 2" rx="8" fill="none"/>
  <text x="740" y="164" font-family="sans-serif" font-size="8" fill="#888">+ Background Image</text>

  <!-- Panel: selected block controls -->
  <line x1="540" y1="194" x2="860" y2="194" stroke="#2a2a40" stroke-width="1"/>
  <text x="554" y="216" font-family="sans-serif" font-size="8" font-weight="600" fill="#666">HEADLINE SETTINGS</text>

  <text x="554" y="242" font-family="sans-serif" font-size="7" fill="#555">Font Size · 96px</text>
  <rect x="554" y="250" width="292" height="4" fill="#2a2a40" rx="2"/>
  <circle cx="640" cy="252" r="5" fill="#6366f1"/>

  <text x="554" y="276" font-family="sans-serif" font-size="7" fill="#555">Line Height · 0.95</text>
  <rect x="554" y="284" width="292" height="4" fill="#2a2a40" rx="2"/>
  <circle cx="580" cy="286" r="5" fill="#6366f1"/>

  <text x="554" y="310" font-family="sans-serif" font-size="7" fill="#555">Letter Spacing · -0.03em</text>
  <rect x="554" y="318" width="292" height="4" fill="#2a2a40" rx="2"/>
  <circle cx="520" cy="320" r="5" fill="#6366f1"/>

  <text x="554" y="344" font-family="sans-serif" font-size="7" fill="#555">Alignment</text>
  <rect x="554" y="352" width="94" height="22" fill="#6366f1" opacity="0.2" rx="5"/>
  <rect x="653" y="352" width="94" height="22" stroke="#444" rx="5" fill="none"/>
  <rect x="752" y="352" width="94" height="22" stroke="#444" rx="5" fill="none"/>

  <text x="554" y="400" font-family="sans-serif" font-size="7" fill="#555">Color</text>
  <circle cx="564" cy="418" r="8" fill="#1a1a1a" stroke="#6366f1" stroke-width="2"/>
  <circle cx="586" cy="418" r="8" fill="#e63946"/>
  <circle cx="608" cy="418" r="8" fill="#457b9d"/>
  <rect x="630" y="410" width="16" height="16" rx="4" stroke="#555" fill="none"/>

  <rect x="540" y="444" width="320" height="28" fill="#fff" rx="8" opacity="0.9"/>
  <text x="700" y="462" font-family="sans-serif" font-size="9" font-weight="600" fill="#1a1a1a" text-anchor="middle">Copy CSS</text>
</svg>
